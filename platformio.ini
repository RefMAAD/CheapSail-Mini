; CheapSail Mini — platformio.ini
; Author: RefMAAD
; Version: Beta 1.0r OTA
;
; REQUIRED: After first build, copy include/lv_conf.h to
;           .pio/libdeps/esp32dev/lvgl/lv_conf.h
;
; OTA UPDATE: After first USB flash, you can update wirelessly:
;   1. Find device IP on the Status screen
;   2. Add to platformio.ini:
;        upload_protocol = espota
;        upload_port     = 192.168.x.x
;        upload_flags    = --auth=cheapsail
;   3. Click upload (→) as normal

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
upload_protocol = espota
upload_port     = 192.168.10.144
upload_flags    = --auth=cheapsail

lib_deps =
    lvgl/lvgl @ ^8.3.0
    bblanchon/ArduinoJson @ ^6.21.0
    lovyan03/LovyanGFX @ ^1.1.16
    links2004/WebSockets @ ^2.4.0

build_flags =
    ; ── LVGL ──────────────────────────────────────────────────────────────────
    -I include
    -D LV_CONF_INCLUDE_SIMPLE

    ; ── WiFi / Moonraker — EDIT THESE ─────────────────────────────────────────
    -D WIFI_SSID=\"YourSSID\"
    -D WIFI_PASS=\"YourPassword\"
    -D MOONRAKER_HOST=\"192.168.x.x\"
    -D MOONRAKER_PORT=7125
